<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniTOR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
</head>

<body>

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header>

        <strong>AniTOR</strong>

        <div class="header-controls">

            <button id="historyBtn" class="btn-secondary">History</button>

            <select id="themeSelect">
                <option value="dark">Dark</option>
                <option value="cyan">Cyan</option>
                <option value="light">Light</option>
                <option value="atom-material">Atom Material</option>
                <option value="default">Default</option>
                <option value="github-dark">GitHub Dark</option>
                <option value="hopscotch">Hopscotch</option>
                <option value="monokai">Monokai</option>
                <option value="okaidia">Okaidia</option>
                <option value="one-dark">One Dark</option>
                <option value="pojoaque">Pojoaque</option>
                <option value="solarized-dark">Solarized Dark</option>
                <option value="twilight">Twilight</option>
                <option value="xonokai">Xonokai</option>
            </select>

        </div>

    </header>


    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <main>

        <!-- INPUT -->

        <div class="input-wrapper">
            <input type="text" id="magnetInput" placeholder="Paste magnet link…" />
            <button id="startBtn">Start Stream</button>
        </div>


        <!-- VIDEO + ANIME INFO (side by side) -->

        <div id="videoUI" style="display: none;">
            <div class="stream-layout">

                <!-- LEFT: Player + status -->
                <div class="stream-main">

                    <div class="viewport-box">
                        <div id="artContainer" class="artplayer-app"></div>
                    </div>

                    <div class="status-panel">
                        <div class="meta-details">
                            <h3 id="videoTitle">Waiting…</h3>
                            <p id="verifiedBadge">Ready</p>
                        </div>
                        <button id="vlcBtn">▶ Open in VLC</button>
                    </div>

                </div>

                <!-- RIGHT: Anime info -->
                <aside id="animePanel" class="anime-panel">
                    <p class="anime-loading">Fetching info…</p>
                </aside>

            </div>
        </div>

    </main>


    <!-- ================================================= -->
    <!-- HISTORY MODAL -->
    <!-- ================================================= -->

    <div id="historyModal" class="modal-overlay">
        <div class="modal-card">

            <div class="modal-header">
                <h2>History</h2>
                <button class="btn-secondary" onclick="closeModal()">✕</button>
            </div>

            <div id="historyList" class="modal-body"></div>

        </div>
    </div>


    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <footer>

        <div id="statsArea" class="telemetry-metrics" style="display: none;">
            <span>Speed: <strong id="speedVal">0 MB/s</strong></span>
            <span>Peers: <strong id="peersVal">0</strong></span>
            <span>Progress: <strong id="progressVal">0%</strong></span>
            <span id="pausedBadge" style="display:none;" class="badge-paused">⏸ Paused</span>
        </div>

        <a href="https://github.com/Arindom-Lane/AniTOR" target="_blank" class="btn-secondary">GitHub</a>

    </footer>


    <!-- ================================================= -->
    <!-- JS -->
    <!-- ================================================= -->

    <script src="main.js"></script>

</body>
</html>
