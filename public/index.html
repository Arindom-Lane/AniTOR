<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniTOR - Torrent Streamer</title>
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <style>
    :root[data-theme="dark"] { --bg: #0d0d11; --panel: #141419; --text: #f1f1f5; --accent: #8a2be2; --border: #22222d; --dim-opacity: 0.10; }
    :root[data-theme="cyan"] { --bg: #00151c; --panel: #00222a; --text: #e1d9c3; --accent: #00ffe0; --border: #003844; --dim-opacity: 0.10; }
    :root[data-theme="light"] { --bg: #fdfdfd; --panel: #f4f4f6; --text: #1a1a1f; --accent: #4b0082; --border: #e2e2e7; --dim-opacity: 0.15; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden; }

    header, .input-wrapper, .status-panel, footer { transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1); opacity: 1; }
    body.cinematic-dim header, body.cinematic-dim .input-wrapper, body.cinematic-dim .status-panel, body.cinematic-dim footer { opacity: var(--dim-opacity); }
    body.cinematic-dim { cursor: none; }

    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; text-transform: uppercase; }
    .header-controls { display: flex; gap: 12px; align-items: center; }
    
    select, button, input { padding: 12px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.9rem; font-weight: 500; outline: none; transition: all 0.25s; }
    input[type="text"] { width: 100%; cursor: text; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.2); }
    
    button { background: var(--accent); color: #fff; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--border); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--panel); border-color: var(--accent); }

    main { flex: 1; max-width: 1100px; width: 100%; margin: 30px auto; padding: 0 20px; }
    .input-wrapper { display: flex; gap: 12px; margin-bottom: 25px; background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    
    .viewport-box { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.4); position: relative; margin-bottom: 20px; z-index: 50; }
    .artplayer-app { width: 100%; aspect-ratio: 16 / 9; }

    #vlcBtn { background: #9e4700; color: #fff; border: 1px solid #bd5500; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    #vlcBtn:hover { background: #b55200; }

    .status-panel { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); padding: 18px 24px; border-radius: 12px; }
    .meta-details h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 650px; }
    .meta-details p { font-size: 0.85rem; color: var(--accent); font-weight: 600; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: 90%; max-width: 650px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1.2rem; font-weight: 700; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    
    .list-item { background: var(--bg); border: 1px solid var(--border); padding: 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .list-item-info { flex: 1; overflow: hidden; }
    .list-item-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .list-item-meta { font-size: 0.8rem; opacity: 0.6; }

    footer { background: var(--panel); border-top: 1px solid var(--border); padding: 20px 40px; text-align: center; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .telemetry-metrics { display: flex; gap: 20px; font-weight: 600; align-items: center; }
  </style>
</head>
<body>

  <header>
    <strong>AniTOR</strong>

    <div class="header-controls">
      <button id="historyMenuBtn" class="btn-secondary">History</button>
      <button id="localMenuBtn" class="btn-secondary">Play Local</button>
      <select id="themeSelect">
        <option value="dark">Dark Theme</option>
        <option value="cyan">Dark Cyan</option>
        <option value="light">Off-White</option>
      </select>
    </div>
  </header>

  <main>
    <div class="input-wrapper">
      <input type="text" id="magnetInput" placeholder="Insert streaming magnet token query sequence or raw video address file link...">
      <button id="startBtn">Initialize Stream</button>
    </div>

    <div id="videoUI" style="display: none;">
      <div class="viewport-box">
        <div id="artContainer" class="artplayer-app"></div>
      </div>

      <div class="status-panel">
        <div class="meta-details">
          <h3 id="videoTitle">Processing Media Metadata Reference Pointer...</h3>
          <p id="verifiedBadge">🔍 Title Verification Pending...</p>
        </div>
        <div>
          <button id="vlcBtn">Open Locally</button>
        </div>
      </div>
    </div>
  </main>

  <div id="historyModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Streaming Session Tracking Logs</h2>
        <button onclick="closeModal('historyModal')" class="btn-secondary" style="padding: 6px 12px;">✕</button>
      </div>
      <div id="historyListContainer" class="modal-body"></div>
    </div>
  </div>

  <div id="localModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Local Cache Index Allocations</h2>
        <button onclick="closeModal('localModal')" class="btn-secondary" style="padding: 6px 12px;">✕</button>
      </div>
      <div id="localListContainer" class="modal-body"></div>
    </div>
  </div>

  <footer>
  
  <div class="telemetry-metrics" id="statsArea" style="display: none;">
    <span>📥 Speed: <strong id="speedVal" style="color: var(--accent);">0.0 MB/s</strong></span>
    <span>👥 Peers: <strong id="peersVal">0</strong></span>
    <span>📦 Cache Status: <strong id="progressVal">0%</strong></span>
  </div>
    <a href="https://github.com/Arindom-Lane/AniTOR" target="_blank"  class="btn-secondary" style="padding:8px 12px;border-radius:8px;">
      GitHub
    </a>

</footer>


  <script src="main.js"></script>
  <script>
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
